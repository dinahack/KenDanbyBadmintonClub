<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ken Danby Badminton Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --court: #14532D;
    --court-dark: #0C3A20;
    --gold: #E6B54A;
    --paper: #F7F5EF;
    --card: #FFFFFF;
    --ink: #1C1C1A;
    --muted: #6B6F6A;
    --line: #E4E1D8;
    --error: #B3261E;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(230,181,74,0.14), transparent 42%),
      radial-gradient(circle at 85% 5%, rgba(148,197,182,0.22), transparent 46%),
      radial-gradient(circle at 50% 100%, rgba(196,222,231,0.30), transparent 55%),
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22140%22%20height%3D%22140%22%3E%0A%20%20%3Cg%20stroke%3D%22%2314532D%22%20stroke-width%3D%221.1%22%20fill%3D%22none%22%20opacity%3D%220.07%22%3E%0A%20%20%20%20%3Cg%20transform%3D%22translate%2820%2C20%29%20rotate%28-25%29%22%3E%0A%20%20%20%20%20%20%3Cellipse%20cx%3D%220%22%20cy%3D%220%22%20rx%3D%2213%22%20ry%3D%2217%22/%3E%0A%20%20%20%20%20%20%3Cline%20x1%3D%220%22%20y1%3D%2217%22%20x2%3D%220%22%20y2%3D%2236%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%20%20%20%20%3Cline%20x1%3D%22-9%22%20y1%3D%22-11%22%20x2%3D%229%22%20y2%3D%2211%22/%3E%0A%20%20%20%20%20%20%3Cline%20x1%3D%229%22%20y1%3D%22-11%22%20x2%3D%22-9%22%20y2%3D%2211%22/%3E%0A%20%20%20%20%3C/g%3E%0A%20%20%20%20%3Cg%20transform%3D%22translate%2895%2C85%29%22%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%223.4%22%20fill%3D%22%2314532D%22%20fill-opacity%3D%220.07%22%20stroke%3D%22none%22/%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M0%2C-3%20L-5%2C-11%20M0%2C-3%20L0%2C-12%20M0%2C-3%20L5%2C-11%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%20%20%3C/g%3E%0A%20%20%20%20%3Cg%20transform%3D%22translate%28105%2C25%29%20rotate%2815%29%20scale%280.7%29%22%3E%0A%20%20%20%20%20%20%3Cellipse%20cx%3D%220%22%20cy%3D%220%22%20rx%3D%2213%22%20ry%3D%2217%22/%3E%0A%20%20%20%20%20%20%3Cline%20x1%3D%220%22%20y1%3D%2217%22%20x2%3D%220%22%20y2%3D%2236%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%20%20%3C/g%3E%0A%20%20%20%20%3Cg%20transform%3D%22translate%2825%2C105%29%22%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%223%22%20fill%3D%22%2314532D%22%20fill-opacity%3D%220.07%22%20stroke%3D%22none%22/%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M0%2C-2.6%20L-4.4%2C-9.6%20M0%2C-2.6%20L0%2C-10.4%20M0%2C-2.6%20L4.4%2C-9.6%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%20%20%3C/g%3E%0A%20%20%3C/g%3E%0A%3C/svg%3E");
    background-repeat: no-repeat, no-repeat, no-repeat, repeat;
    background-size: auto, auto, auto, 140px 140px;
    background-attachment: fixed, fixed, fixed, local;
    color: var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding: calc(28px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  h1,h2,h3{font-family:'Space Grotesk', system-ui, sans-serif; margin:0;}
  .wrap{width:100%; max-width:440px;}
  .home-screen{min-height:calc(100vh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); min-height:calc(100svh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column;}
  body:has(.home-screen){padding-top:calc(12px + env(safe-area-inset-top,0px)); padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}
  .check-in-screen{min-height:calc(100vh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); min-height:calc(100svh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column;}
  body:has(.check-in-screen){padding-top:calc(12px + env(safe-area-inset-top,0px)); padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}
  .check-in-screen .back{margin-bottom:10px;}
  .check-in-screen .brand{gap:6px; margin-bottom:12px;}
  .check-in-screen .birdie{width:76px;}
  .check-in-screen .card{padding:18px;}
  .check-in-screen .title{font-size:24px; margin-bottom:4px;}
  .check-in-screen p.sub{font-size:13px; margin-bottom:6px;}
  .check-in-screen #checkInDateTime{font-size:12px; margin-top:2px; margin-bottom:8px;}
  .check-in-screen .field{margin-bottom:8px;}
  .check-in-screen label{font-size:12.5px; margin-bottom:4px;}
  .check-in-screen input[type="text"]{padding:9px 11px; font-size:15px;}
  .check-in-screen .radio-option{min-height:38px;}
  .check-in-screen .stepper button{width:38px; height:36px;}
  .check-in-screen .stepper .count{width:44px; height:36px; line-height:36px; font-size:16px;}
  .check-in-screen .hint{font-size:11px; line-height:1.3; margin-top:3px;}
  .check-in-screen .primary{padding:10px; margin-top:2px;}
  @media (max-height:760px){
    body:has(.check-in-screen){padding-top:calc(8px + env(safe-area-inset-top,0px)); padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));}
    .check-in-screen{min-height:calc(100vh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); min-height:calc(100svh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));}
    .check-in-screen .brand{gap:4px; margin-bottom:8px;}
    .check-in-screen .birdie{width:64px;}
    .check-in-screen .card{padding:14px;}
    .check-in-screen .sub{display:none;}
    .check-in-screen .field{margin-bottom:6px;}
  }
  @media (max-height:620px){
    body:has(.check-in-screen){padding-top:calc(6px + env(safe-area-inset-top,0px)); padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));}
    .check-in-screen{min-height:calc(100vh - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); min-height:calc(100svh - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));}
    .check-in-screen .brand{gap:2px; margin-bottom:5px;}
    .check-in-screen .birdie{width:48px;}
    .check-in-screen .brand .tagline{display:none;}
    .check-in-screen .card{padding:10px;}
    .check-in-screen .field{margin-bottom:4px;}
    .check-in-screen label{font-size:12px; margin-bottom:2px;}
    .check-in-screen input[type="text"]{padding:6px 9px; font-size:14px;}
    .check-in-screen .radio-option{min-height:32px;}
    .check-in-screen .stepper button{width:34px; height:30px;}
    .check-in-screen .stepper .count{width:38px; height:30px; line-height:30px; font-size:14px;}
    .check-in-screen .hint{font-size:10.5px; line-height:1.2; margin-top:2px;}
    .check-in-screen .primary{padding:8px; font-size:15px;}
  }
  @media (max-height:760px) and (min-width:320px){
    .wrap:has(.check-in-screen){max-width:680px;}
    #checkInCard{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); column-gap:12px; row-gap:4px;}
    #checkInCard > #checkInTitle,
    #checkInCard > #checkInInstructions,
    #checkInCard > #checkInDateTime,
    #checkInCard > #fullNameField,
    #checkInCard > #registeredClubMemberField,
    #checkInCard > #referralField,
    #checkInCard > #friendNameField,
    #checkInCard > #adultsCountField,
    #checkInCard > #kidsCountField,
    #checkInCard > #submitBtn,
    #checkInCard > #msg{grid-column:1 / -1;}
    #checkInCard > .field{margin-bottom:0;}
  }
  @media (max-height:620px) and (min-width:500px){
    body:has(.check-in-screen){padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
    .check-in-screen{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));}
    .check-in-screen .back{margin-bottom:2px;}
    .check-in-screen .brand{margin-bottom:1px;}
    .check-in-screen .birdie{display:none;}
    #checkInCard{padding:8px 12px; row-gap:1px;}
    #checkInCard .title{font-size:20px;}
    #checkInCard #checkInDateTime{margin-bottom:4px;}
  }
  .brand{
    display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:26px; justify-content:center;
  }
  .birdie{width:110px;height:auto;flex-shrink:0;}
  .brand span{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16.5px; color:var(--court-dark); letter-spacing:.01em; text-align:center;}
  .brand .tagline{font-family:'Inter', sans-serif; font-weight:500; font-size:13px; color:var(--muted); margin-top:-4px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding:28px 26px;
    box-shadow: 0 1px 2px rgba(20,20,15,0.04);
  }
  h1.title{font-size:26px; line-height:1.15; color:var(--court-dark); margin-bottom:6px;}
  p.sub{color:var(--muted); font-size:14.5px; margin:0 0 24px 0; line-height:1.5;}
  p.sub.check-in-sub{margin-bottom:4px;}
  label{display:block; font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:7px;}
  input[type=text], input[type=email], textarea, select{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:16px; font-family:'Inter', sans-serif; background:#fff; color:#000000;
  }
  select{appearance:auto; cursor:pointer;}
  textarea{resize:vertical; min-height:120px; line-height:1.5;}
  input[type=text]:focus, input[type=email]:focus, textarea:focus, select:focus{outline:2px solid var(--court); outline-offset:1px; border-color:var(--court);}
  .field{margin-bottom:20px;}
  .home-session-info{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:7px 18px; margin:14px 0 18px; color:var(--ink); font-size:13px;}
  .home-session-info p{margin:0; white-space:nowrap;}
  .support-note{margin:16px 0 0; color:var(--court); font-size:12px; font-weight:400; text-align:center;}
  .radio-options{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); width:100%; overflow:hidden; border:1.5px solid var(--line); border-radius:8px;}
  .radio-option{position:relative; display:flex; align-items:center; justify-content:center; min-height:46px; margin:0; background:#fff; color:var(--ink); font-weight:600; cursor:pointer; transition:background-color .15s ease, color .15s ease;}
  .radio-option + .radio-option{border-left:1.5px solid var(--line);}
  .radio-option input{position:absolute; width:1px; height:1px; margin:0; opacity:0;}
  .radio-option:focus-within{outline:2px solid var(--court); outline-offset:-3px; z-index:1;}
  .radio-option:has(input[value="Yes"]:checked){background:#15803D; color:#fff;}
  .radio-option:has(input[value="No"]:checked){background:#B42318; color:#fff;}
  .family-members-label{font-size:13.5px; font-weight:600; color:var(--ink); margin:0 0 7px;}
  .family-member-entry{margin-bottom:10px;}
  .family-member-entry label{font-weight:500;}
  .family-member-controls{display:flex; align-items:center; gap:10px;}
  .family-member-controls input{flex:1; min-width:0;}
  .remove-family-member{border:0; background:none; color:var(--muted); cursor:pointer; font:inherit; font-size:13px;}
  .add-family-member-btn{display:block; width:100%; margin-top:10px; padding:12px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--court-dark); font:600 14px 'Inter', sans-serif; cursor:pointer;}
  .add-family-member-btn:hover{border-color:var(--court); background:#fff;}
  .add-family-member-btn:focus-visible{outline:2px solid var(--court); outline-offset:2px;}
  .stepper{
    display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; width:fit-content;
  }
  .stepper button{
    width:44px; height:44px; border:none; background:#fff; font-size:20px; color:var(--court-dark);
    cursor:pointer; font-family:'Space Grotesk', sans-serif;
  }
  .stepper button:hover{background:var(--paper);}
  .stepper button:focus-visible{outline:2px solid var(--court); outline-offset:-2px;}
  .stepper .count{
    width:52px; text-align:center; font-size:18px; font-weight:600; font-family:'Space Grotesk', sans-serif;
    border-left:1.5px solid var(--line); border-right:1.5px solid var(--line); height:44px; line-height:44px;
  }
  .hint{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .registration-fee-note{margin:0 0 20px; padding:12px 14px; border-left:4px solid #E6B54A; border-radius:6px; background:#FFF4CC; color:var(--ink); font-weight:600; line-height:1.5;}
  button.primary{
    width:100%; padding:15px; border:none; border-radius:10px; background:var(--court);
    color:#fff; font-size:16px; font-weight:600; font-family:'Space Grotesk', sans-serif;
    cursor:pointer; margin-top:6px; transition: transform .08s ease, background .15s ease;
  }
  button.primary:hover{background:var(--court-dark);}
  button.primary:active{transform: scale(0.98);}
  button.primary:disabled{background:#B9BDB4; cursor:not-allowed;}
  .msg{font-size:13.5px; margin-top:12px; min-height:0;}
  .msg.error{color:var(--error);}
  .confirm{text-align:center; padding:10px 0 4px;}
  .confirm .check{
    width:52px; height:52px; border-radius:50%; background:var(--court); color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:26px;
  }
  .confirm h2{font-size:21px; color:var(--court-dark); margin-bottom:6px;}
  .confirm p{color:var(--muted); font-size:14px; margin:0 0 4px;}
  .confirm .total{
    display:inline-block; margin-top:14px; padding:8px 16px; border-radius:20px;
    background:var(--paper); border:1px solid var(--line); font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:14px; color:var(--court-dark);
  }
  .again{
    margin-top:18px; background:none; border:none; color:var(--court); font-weight:600;
    font-size:14px; cursor:pointer; text-decoration:underline; font-family:'Inter', sans-serif;
  }
  .back{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--muted);
    cursor:pointer; font-size:13.5px; margin-bottom:16px; padding:0; font-family:'Inter', sans-serif;
  }
  .back:hover{color:var(--court-dark);}
  /* Home menu */
  .menu{display:flex; flex:1; flex-direction:column; justify-content:space-evenly; gap:12px;}
  .menu-item{
    display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:16px 18px; cursor:pointer; text-align:left; width:100%;
    font-family:'Inter', sans-serif; transition: border-color .12s ease, background .12s ease;
  }
  .menu-item:hover{border-color:var(--court); background:#fff;}
  .menu-item .icon{
    width:40px; height:40px; border-radius:10px; background:var(--paper); display:flex; align-items:center;
    justify-content:center; flex-shrink:0;
  }
  .menu-item .icon svg{width:20px; height:20px;}
  .menu-item .txt h3{font-size:15.5px; color:var(--court-dark); margin-bottom:2px;}
  .menu-item .txt p{font-size:12.5px; color:var(--muted); margin:0;}
  .menu-item .chev{margin-left:auto; color:var(--muted); font-size:18px; flex-shrink:0;}
  .whatsapp-btn{
    display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px;
    background:#25D366; color:#fff; text-decoration:none; border-radius:12px; padding:13px 16px;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    box-shadow:0 1px 2px rgba(20,20,15,0.08); transition: background .12s ease;
  }
  .whatsapp-btn svg{width:20px; height:20px; flex-shrink:0;}
  .whatsapp-btn:hover{background:#1EBE5A;}
  @media (max-height:760px){
    .home-screen .brand{gap:6px; margin-bottom:12px;}
    .home-screen .birdie{width:76px;}
    .home-screen .home-session-info{margin:6px 0 10px; gap:5px 14px;}
    .home-screen .menu{gap:6px;}
    .home-screen .menu-item{padding:9px 12px; gap:10px;}
    .home-screen .menu-item .icon{width:34px; height:34px;}
    .home-screen .menu-item .txt h3{font-size:14px;}
    .home-screen .menu-item .txt p{font-size:11.5px;}
    .home-screen .whatsapp-btn{margin-top:8px; padding:10px 12px; font-size:13px;}
    .home-screen .support-note{margin-top:8px;}
  }
  @media (max-height:620px){
    body:has(.home-screen){padding-top:calc(6px + env(safe-area-inset-top,0px)); padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));}
    .home-screen{min-height:calc(100vh - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); min-height:calc(100svh - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));}
    .home-screen .brand{gap:2px; margin-bottom:6px;}
    .home-screen .birdie{width:54px;}
    .home-screen .brand .tagline{display:none;}
    .home-screen .home-session-info{margin:4px 0 6px;}
    .home-screen .menu{gap:4px;}
    .home-screen .menu-item{padding:6px 10px; gap:8px; border-radius:8px;}
    .home-screen .menu-item .icon{width:28px; height:28px; border-radius:7px;}
    .home-screen .menu-item .icon svg{width:17px; height:17px;}
    .home-screen .menu-item .txt h3{font-size:13px;}
    .home-screen .menu-item .txt p{display:none;}
    .home-screen .whatsapp-btn{margin-top:6px; padding:8px 10px;}
    .home-screen .support-note{margin-top:6px;}
  }
  @media (max-height:620px) and (min-width:500px){
    .wrap:has(.home-screen){max-width:760px;}
    .home-screen .menu{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); align-content:space-evenly; gap:6px;}
    .home-screen .menu-item:last-child{grid-column:1 / -1;}
  }
  /* Rules */
  .tabs{display:flex; gap:4px; margin:4px 0 16px; border-bottom:1px solid var(--line);}
  .tab-btn{flex:1; padding:10px 4px; border:none; background:none; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab-btn.active{color:var(--court-dark); border-bottom-color:var(--court);}
  .schedule-list{max-height:360px; overflow-y:auto;}
  .sched-row{display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .sched-row:last-child{border-bottom:none;}
  .sched-date{color:var(--ink); font-weight:500;}
  .sched-time{color:var(--muted);}
  .rules{list-style:none; margin:0; padding:0; counter-reset:rule;}
  .rules li{
    counter-increment:rule; display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);
    font-size:14px; line-height:1.55; color:var(--ink);
  }
  .rules li:last-child{border-bottom:none; padding-bottom:0;}
  .rules li::before{
    content:counter(rule); flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--paper);
    color:var(--court-dark); font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:12.5px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  /* Coordinators */
  .coord-card{
    display:flex; align-items:center; gap:16px; border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:14px;
  }
  .coord-card:last-child{margin-bottom:0;}
  .coord-avatar{
    width:84px; height:84px; border-radius:50%; background:var(--court); color:#fff; flex-shrink:0;

// ---- Attendance ----
function renderCheckIn(){
  app.innerHTML = `
    <div class="check-in-screen">
    ${backBtn()}
    ${brandHeader()}
    <div class="card" id="checkInCard">
      <h1 class="title" id="checkInTitle">Court check-in</h1>
      <p class="sub check-in-sub" id="checkInInstructions">Enter your family details to record today’s attendance. The date and time will be recorded automatically.</p>
      <p class="hint" id="checkInDateTime" aria-live="polite"></p>
        <div class="field" id="fullNameField">
          <label for="fullName">Full name</label>
        <input type="text" id="fullName" placeholder="e.g. Jane Smith" autocomplete="name">
      </div>
      <div class="field" id="registeredClubMemberField">
        <label>Registered Club Member?</label>
        <div class="radio-options" role="radiogroup" aria-label="Registered Club Member">
          <label class="radio-option" for="registeredClubMemberYes"><input type="radio" id="registeredClubMemberYes" name="registeredClubMember" value="Yes"><span>YES</span></label>
          <label class="radio-option" for="registeredClubMemberNo"><input type="radio" id="registeredClubMemberNo" name="registeredClubMember" value="No"><span>NO</span></label>
        </div>
      </div>
      <div class="field" id="referralField" hidden>
        <label for="referralSource">How did you come to know about the club?</label>
        <select id="referralSource">
          <option value="">Select an option</option>
          <option value="Social Media">Social Media</option>
          <option value="Westminster / Guelph Neighbourhood Community">Westminster / Guelph Neighbourhood Community</option>
          <option value="Friend">Friend</option>
        </select>
      </div>
      <div class="field" id="friendNameField" hidden>
        <label for="friendName">Friend Name</label>
        <input type="text" id="friendName" placeholder="Friend's name" autocomplete="name">
      </div>
      <div class="field" id="adultsCountField">
        <label id="adultsCountLabel">Additional registered adults accompanying you (excluding yourself)</label>
        <div class="stepper" role="group" aria-labelledby="adultsCountLabel">
          <button type="button" data-step="-1" aria-label="Remove one additional adult">&minus;</button>
          <div class="count" id="adultsCount" aria-live="polite">0</div>
          <button type="button" data-step="1" aria-label="Add one additional adult">+</button>
        </div>
      </div>
      <div class="field" id="kidsCountField">
        <label id="kidsCountLabel">Children Under 18</label>
        <div class="stepper" role="group" aria-labelledby="kidsCountLabel">
          <button type="button" data-step="-1" aria-label="Remove one child under 18">&minus;</button>
          <div class="count" id="kidsCount" aria-live="polite">0</div>
          <button type="button" data-step="1" aria-label="Add one child under 18">+</button>
        </div>
        <p class="hint">Non-registered members must complete their own check-in.</p>
      </div>
      <button class="primary" id="submitBtn">&#10003; Check In</button>
      <div class="msg" id="msg"></div>
    </div>
    </div>
  `;
  attachBack();
  document.getElementById('submitBtn').onclick = submitCheckIn;
  document.querySelectorAll('input[name="registeredClubMember"]').forEach(input => input.addEventListener('change', e => {
    document.getElementById('referralField').hidden = e.target.value !== 'No';
    document.getElementById('adultsCountField').hidden = e.target.value === 'No';
    if(e.target.value === 'No') document.getElementById('adultsCount').textContent = '0';
    if(e.target.value !== 'No'){
      document.getElementById('referralSource').value = '';
      document.getElementById('friendName').value = '';
      document.getElementById('friendNameField').hidden = true;
    }
  }));
  document.getElementById('referralSource').addEventListener('change', e => {
    document.getElementById('friendNameField').hidden = e.target.value !== 'Friend';
    if(e.target.value !== 'Friend') document.getElementById('friendName').value = '';
  });
  document.getElementById('fullName').addEventListener('keydown', e => { if(e.key === 'Enter') submitCheckIn(); });
  document.querySelectorAll('.stepper').forEach(stepper => {
    const count = stepper.querySelector('.count');
    stepper.querySelectorAll('button[data-step]').forEach(button => {
      button.addEventListener('click', () => {
        const nextCount = Number(count.textContent) + Number(button.dataset.step);
        count.textContent = Math.max(0, nextCount);
      });
    });
  });
  updateCheckInDateTime();
}

function updateCheckInDateTime(){
  const dateTimeElement = document.getElementById('checkInDateTime');
  if(!dateTimeElement) return;
  dateTimeElement.textContent = `Current date & time: ${new Date().toLocaleString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'numeric', minute:'2-digit', second:'2-digit' })}`;
  window.setTimeout(updateCheckInDateTime, 1000);
}

function setMsg(text, isError){
  const m = document.getElementById('msg');
  if(!m) return;
  m.textContent = text;
  m.className = 'msg' + (isError ? ' error' : '');
}

async function submitCheckIn(){
  const name = document.getElementById('fullName').value.trim();
  if(!name){ setMsg('Please enter your full name.', true); return; }
  const registeredClubMemberInput = document.querySelector('input[name="registeredClubMember"]:checked');
  const registeredClubMember = registeredClubMemberInput ? registeredClubMemberInput.value : '';
  const referralSource = document.getElementById('referralSource').value;
  const friendName = document.getElementById('friendName').value.trim();
  if(!registeredClubMember){ setMsg('Please select whether you are a registered club member.', true); return; }
  if(registeredClubMember === 'No' && !referralSource){ setMsg('Please tell us how you heard about the club.', true); return; }
  if(referralSource === 'Friend' && !friendName){ setMsg('Please enter your friend\'s name.', true); return; }
  if(CONFIG.scriptURL.includes('PASTE_YOUR')){ setMsg('Setup needed: add your Google Apps Script URL in the file (see CONFIG).', true); return; }

  const adults = Number(document.getElementById('adultsCount').textContent);
  const kids = Number(document.getElementById('kidsCount').textContent);
  const familyMembers = adults + kids;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Checking in...';
  setMsg('');

  try{
    const res = await fetch(CONFIG.scriptURL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'checkin', fullName: name, familyMembers: familyMembers, registeredClubMember, referralSource, friendName, adults, kids })
    });
    const data = await res.json();
    if(data.success){
      renderCheckInConfirmation(name, familyMembers, registeredClubMember);
    } else {
      setMsg(data.error || 'Something went wrong. Please try again.', true);
      btn.disabled = false; btn.textContent = '\u2713 Check In';
    }
  }catch(err){
    setMsg('Could not reach the attendance sheet. Check your connection and try again.', true);
    btn.disabled = false; btn.textContent = '\u2713 Check In';
  }
}

function renderCheckInConfirmation(name, family, registeredClubMember){
  const now = new Date();
  const timeStr = now.toLocaleString(undefined, { weekday:'short', hour:'numeric', minute:'2-digit', month:'short', day:'numeric' });
  app.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="confirm">
        <div class="check">&#10003;</div>
        <h2>You're checked in</h2>
        <p>${name}</p>
        <p>${timeStr}</p>
        <div class="total">${family + 1} attendee${family + 1 === 1 ? '' : 's'} total</div>
        ${registeredClubMember === 'No' ? '<p class="hint" style="margin-top:12px; color:#b42318; font-weight:700;">Please register with the club if you plan to attend more than one session over the next two months.</p>' : ''}
        <br>
        <button class="again" id="againBtn">Check in someone else</button>
        <br>
        <button class="again" id="homeBtn" style="margin-top:6px;">Back to menu</button>
      </div>
    </div>
  `;
  document.getElementById('againBtn').onclick = renderCheckIn;
  document.getElementById('homeBtn').onclick = renderHome;
}

      <p class="sub">Fill in your details to join the club. A $${CONFIG.registrationFee} registration fee applies to a family, going to club expenses. Kids are always welcome!</p>

      <div class="field" style="display:flex; gap:10px; align-items:flex-start;">
        <input type="checkbox" id="regAgree" style="width:18px; height:18px; margin-top:2px; flex-shrink:0;">

    familyMemberCount += 1;
    const entry = document.createElement('div');
    entry.className = 'family-member-entry';
    entry.innerHTML = `
      <label for="regFamilyMember${familyMemberCount}">Adult family member ${familyMemberCount}</label>
      <div class="family-member-controls">
        <input type="text" id="regFamilyMember${familyMemberCount}" placeholder="Family member full name" autocomplete="off">
        <button type="button" class="remove-family-member" aria-label="Remove adult family member ${familyMemberCount}">Remove</button>
      </div>
    `;
    entry.querySelector('.remove-family-member').onclick = () => entry.remove();
    document.getElementById('regFamilyMembers').appendChild(entry);
  };
}

async function submitRegister(){
  const first = document.getElementById('regFirst').value.trim();
  const last = document.getElementById('regLast').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const skill = document.getElementById('regSkill').value;
  const agree = document.getElementById('regAgree').checked;
  const adultFamilyMembers = Array.from(document.querySelectorAll('#regFamilyMembers input'))
    .map(input => input.value.trim())
    .filter(Boolean);

  if(!first || !last){ setMsg('Please enter your first and last name.', true); return; }
  if(!phone && !email){ setMsg('Please enter a phone number or email.', true); return; }
  if(phone && !/^\d{10}$/.test(phone)){ setMsg('Please enter a phone number with exactly 10 digits.', true); return; }
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ setMsg('Please enter a valid email address.', true); return; }
  if(!agree){ setMsg('Please confirm you agree to the guidelines.', true); return; }
  if(CONFIG.scriptURL.includes('PASTE_YOUR')){ setMsg('Setup needed: add your Google Apps Script URL in the file (see CONFIG).', true); return; }

  const btn = document.getElementById('regSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  setMsg('');

  try{
    const res = await fetch(CONFIG.scriptURL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'register', firstName: first, lastName: last, phone, email, skillLevel: skill, agreedToGuidelines: agree, fee: CONFIG.registrationFee, adultFamilyMembers })
    });
    const data = await res.json();
    if(data.success){
      renderRegisterConfirmation(first);
    } else {
      setMsg(data.error || 'Something went wrong. Please try again.', true);
      btn.disabled = false; btn.textContent = 'Submit registration';
    }
  }catch(err){
    setMsg('Could not reach the registration form. Check your connection and try again.', true);
    btn.disabled = false; btn.textContent = 'Submit registration';
  }
}

function renderRegisterConfirmation(name){
  app.innerHTML = `

      <div class="confirm">
        <div class="check">&#10003;</div>
        <h2>Registration received</h2>

}

  app.innerHTML = `

async function submitFeedback(){
  const text = document.getElementById('feedbackText').value.trim();
  if(!text){ setMsg('Please write something before submitting.', true); return; }

  const btn = document.getElementById('feedbackBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  setMsg('');
  try{
    const res = await fetch(CONFIG.scriptURL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ action: 'feedback', feedback: text })
    });
    const data = await res.json();
    if(data.success){
      renderFeedbackConfirmation();
    } else {
      setMsg(data.error || 'Something went wrong. Please try again.', true);
      btn.disabled = false; btn.textContent = 'Submit feedback';
    }
  }catch(err){
    setMsg('Could not reach the attendance sheet. Check your connection and try again.', true);
    btn.disabled = false; btn.textContent = 'Submit feedback';
  }
}

// ---- Club rules & schedule (tabbed) ----
function rulesTabHTML(){
  return `<ul class="rules">${RULES.map(r => `<li>${r}</li>`).join('')}</ul>`;
}
function scheduleTabHTML(){
  const rows = SCHEDULE.map(s => `<div class="sched-row"><span class="sched-date">${s.date}</span><span class="sched-time">${s.start}\u2013${s.end}</span></div>`).join('');
  return `
    <p class="hint" style="margin-bottom:14px;">Location: <a href="${SCHEDULE_INFO.mapLink}" target="_blank" rel="noopener noreferrer">${SCHEDULE_INFO.location}</a><br>
    Time: ${SCHEDULE_INFO.sessionTime}</p>
    <p class="hint" style="margin:0 0 10px;">Permitted dates and times:</p>
    <div class="schedule-list">${rows}</div>
  `;
}
function renderRulesSchedule(tab){
  tab = tab || 'rules';
  const tabs = [
    { id: 'rules', label: 'Rules' },
    { id: 'schedule', label: 'Schedule' }
  ];
  const content = tab === 'schedule' ? scheduleTabHTML() : rulesTabHTML();
  app.innerHTML = `
    ${backBtn()}
    ${brandHeader()}
    <div class="card">
      <h1 class="title">Club rules &amp; schedule</h1>
      <p class="sub">Court conduct and session times.</p>
      <div class="tabs">
        ${tabs.map(t => `<button class="tab-btn ${tab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('')}
      </div>
      <div class="tab-panel">${content}</div>
    </div>
  `;
  attachBack();
  document.querySelectorAll('.tab-btn').forEach(b => { b.onclick = () => renderRulesSchedule(b.dataset.tab); });
}

// ---- Coordinators ----

  app.innerHTML = `

        <div class="coord-card">
          <div class="coord-avatar" ${c.photo ? `style="background-image:url('${c.photo}'); background-size:cover; background-position:center;"` : ''}>${c.photo ? '' : c.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
          <div class="coord-info">
            <div class="role">${c.role}</div>

            <a href="tel:${c.phone}">${c.phone}</a>

}
